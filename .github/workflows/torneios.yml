name: Atualizar torneios

on:
  schedule:
    - cron: "17 0,10,20 * * *"   # 3x por dia: 07h17, 17h17 e 21h17 de Brasília
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Baixar Cups e Challenges de SP
        run: python scripts/update_torneios.py torneios.json
      - name: Publicar
        run: |
          git config user.name "origem-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add torneios.json
          git diff --cached --quiet && echo "Sem mudanças" && exit 0
          git commit -m "Atualiza torneios $(date -u +%Y-%m-%d)"
          git push
